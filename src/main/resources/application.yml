spring:
  application:
    name: small-shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smallshop}
    username: ${DB_USERNAME:smallshop}
    password: ${DB_PASSWORD:smallshop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    time-to-live: ${JWT_TIME_TO_LIVE:1h}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

name: small-shop-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smallshop
      POSTGRES_USER: smallshop
      POSTGRES_PASSWORD: smallshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallshop -d smallshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
